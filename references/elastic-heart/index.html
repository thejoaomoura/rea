<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elastic Heart Lyric</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--navy:#0E1A2E;--red:#E8384F;--paper:#F3EFE9;--neon:#3D6BFF}
html,body{margin:0;height:100%;background:#05080f;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--navy)}
.full{position:absolute;inset:0}
#bgNavy{background:radial-gradient(110% 70% at 50% 40%,#16274a 0%,#0E1A2E 55%,#070d19 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#bgCream{background:radial-gradient(120% 75% at 50% 40%,#fbf8f3 0%,#F3EFE9 50%,#e4ddd2 100%);clip-path:inset(0 0 0 100%)}
#bgCream::after{content:"";position:absolute;inset:0;background:radial-gradient(50% 35% at 80% 15%,rgba(232,56,79,.07),transparent 70%),radial-gradient(50% 35% at 15% 85%,rgba(14,26,46,.08),transparent 70%)}
#bgHeart{background:radial-gradient(90% 60% at 50% 48%,#2a1530 0%,#141a33 45%,#0a1020 100%);opacity:0;
  -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'><path d='M50 88 C22 66 0 48 0 26 C0 11 11 0 26 0 C37 0 45 6 50 14 C55 6 63 0 74 0 C89 0 100 11 100 26 C100 48 78 66 50 88Z'/></svg>");
  -webkit-mask-repeat:no-repeat;-webkit-mask-position:50% 47%;-webkit-mask-size:0px}
#world{position:absolute;inset:0;perspective:1500px}
#shake,#cam{position:absolute;inset:0;transform-style:preserve-3d}
.ln{position:absolute;white-space:nowrap;line-height:1;transform-style:preserve-3d;opacity:0}
.wd{display:inline-block;transform-style:preserve-3d}
.ch{display:inline-block}
.card{position:absolute;opacity:0;background:var(--paper);box-shadow:0 18px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3)}
.card img{position:absolute;display:block;object-fit:cover}
.tape{position:absolute;width:150px;height:44px;left:50%;top:-20px;margin-left:-75px;background:rgba(243,239,233,.72);transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.stick{position:absolute;opacity:0;border-radius:58px;border:16px solid var(--paper);overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.stick img{width:100%;height:100%;object-fit:cover;display:block}
.frag{position:absolute;left:0;top:0}
.latex{color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(180deg,#ffd3d9 0%,#ff7183 16%,#E8384F 38%,#b3162f 74%,#e9475d 100%);-webkit-background-clip:text;background-clip:text;padding:.08em .14em}
.latexWrap{filter:drop-shadow(0 0 1.5px #F3EFE9) drop-shadow(0 0 1px #F3EFE9) drop-shadow(0 0 22px rgba(232,56,79,.45)) drop-shadow(0 14px 16px rgba(0,0,0,.55))}
#grain{mix-blend-mode:overlay;opacity:.36;pointer-events:none}
#vign{pointer-events:none;background:radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(3,6,14,.45) 100%)}
#flash{pointer-events:none;opacity:0;background:radial-gradient(60% 40% at 50% 46%,#ffffff,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 80%)}
#fade{background:#05080f;opacity:0;pointer-events:none}
#wm{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:'DM Mono';font-weight:500;font-size:30px;letter-spacing:.14em;color:var(--paper);mix-blend-mode:difference;opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgNavy" class="full"><div class="blob" id="blobA" style="width:900px;height:900px;left:-300px;top:200px;background:#2a47b8"></div><div class="blob" id="blobB" style="width:800px;height:800px;left:520px;top:1100px;background:#7a1f3d"></div></div>
  <div id="bgCream" class="full"></div>
  <div id="bgHeart" class="full"></div>
  <canvas id="stageFx" class="full" width="1080" height="1920"></canvas>
  <div id="world"><div id="shake"><div id="cam"></div></div></div>
  <div id="flash" class="full"></div>
  <div id="grain" class="full"></div>
  <div id="vign" class="full"></div>
  <div id="fade" class="full"></div>
  <div id="wm">@moura’slyrics</div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<audio id="aud" src="assets/chorus.mp3" preload="auto"></audio>
<script src="assets/gsap.min.js"></script>
<script>
(async()=>{
/* video time = song time - 26.3 */
const DUR=72.0, BEAT=0.6966, PH=40.511-26.3;
const NAVY='#0E1A2E', RED='#E8384F', PAPER='#F3EFE9', NEON='#3D6BFF';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cam=$('#cam'),shake=$('#shake'),fx=$('#fx');
const params=new URLSearchParams(location.search),CLEAN=params.has('clean');
function fit(){const k=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(${(innerWidth-1080*k)/2}px,${(innerHeight-1920*k)/2}px) scale(${k})`}
fit();addEventListener('resize',fit);
await Promise.all(["900 40px Anybody","italic 900 40px Anybody","400 40px Fraunces","italic 900 40px Fraunces","italic 300 40px Fraunces","600 40px Archivo","900 40px Archivo","italic 800 40px Archivo","400 40px 'DM Mono'","500 40px 'DM Mono'"].map(f=>document.fonts.load(f)));
await document.fonts.ready;
const imgs=await Promise.all([1,2,3,4,5].map(i=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=`assets/photos/p${i}.jpg`})));
const SRC=i=>`assets/photos/p${i}.jpg`;

function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

/* ---------- builders ---------- */
const tl=gsap.timeline({paused:true});
let fid=0;
function blurFilter(){const id='mb'+(fid++);const f=document.createElementNS('http://www.w3.org/2000/svg','filter');
 f.setAttribute('id',id);f.setAttribute('x','-80%');f.setAttribute('y','-80%');f.setAttribute('width','260%');f.setAttribute('height','260%');
 const b=document.createElementNS('http://www.w3.org/2000/svg','feGaussianBlur');b.setAttribute('stdDeviation','0 0');f.appendChild(b);fx.appendChild(f);return{id,b}}
function blurT(el,at,from,to,dur,axis='y',ease='power3.out'){const {id,b}=blurFilter();const o={v:from};
 tl.fromTo(o,{v:from},{v:to,duration:dur,ease,immediateRender:false,onUpdate(){const v=o.v;
  if(v<.2){el.style.filter=el.dataset.f||'none';return}
  b.setAttribute('stdDeviation',axis==='y'?`${(v*.07).toFixed(2)} ${v.toFixed(2)}`:axis==='x'?`${v.toFixed(2)} ${(v*.07).toFixed(2)}`:`${(v*.6).toFixed(2)} ${(v*.6).toFixed(2)}`);
  el.style.filter=`url(#${id})`;}},at)}
function ext(col,n=12,dx=.7,dy=1,soft='rgba(0,0,0,.3)'){let a=[];for(let i=1;i<=n;i++)a.push(`${(i*dx).toFixed(1)}px ${(i*dy).toFixed(1)}px 0 ${col}`);a.push(`${n*dx+6}px ${n*dy+14}px 24px ${soft}`);return a.join(',')}
function line(txt,o){const el=document.createElement('div');el.className='ln'+(o.cls?' '+o.cls:'');
 el.style.cssText=`left:${o.x??540}px;top:${o.y}px;font-family:'${o.font}';font-size:${o.size}px;font-weight:${o.w??500};font-style:${o.it?'italic':'normal'};letter-spacing:${o.ls??0}em;color:${o.color??PAPER};${o.fvs?`font-variation-settings:${o.fvs};`:''}${o.css??''}`;
 const words=[],chars=[];txt.split(' ').forEach((w,i)=>{if(i)el.appendChild(document.createTextNode(' '));const wd=document.createElement('span');wd.className='wd';
  [...w].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch;wd.appendChild(s);chars.push(s)});el.appendChild(wd);words.push(wd)});
 (o.parent??cam).appendChild(el);gsap.set(el,{xPercent:-50,yPercent:-50,z:o.z??0});
 return{el,words,chars,wc:words.map(w=>[...w.children])}}
const show=(el,at)=>tl.set(el,{opacity:1},at);
const impulses=[];const kick=(t,a)=>impulses.push([t,a]);
function inRise(u,el,at,{dur=.9,st=.035,yp=75,sy=1.6,blur=26}={}){show(el,at);
 tl.fromTo(u,{opacity:0,yPercent:yp,scaleY:sy,transformOrigin:'50% 100%'},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurT(el,at,blur,0,dur*.85,'y')}
function inDim(u,el,at,{dur=.8,y=30,blur=14}={}){show(el,at);
 tl.fromTo(u,{opacity:0,y},{opacity:1,y:0,duration:dur,ease:'power3.out',immediateRender:false},at);blurT(el,at,blur,0,dur*.8,'y')}
function inSquash(u,el,at,{dur=1.0,st=.04,blur=20}={}){show(el,at); // rubber: squash then elastic settle
 tl.fromTo(u,{opacity:0,scaleY:.15,scaleX:1.6,transformOrigin:'50% 100%'},{opacity:1,scaleY:1,scaleX:1,duration:dur,ease:'elastic.out(1,.38)',stagger:st,immediateRender:false},at);blurT(el,at,blur,0,dur*.4,'y')}
function inSlam(u,el,at,{from=2.4,dur=.55,amp=12,st=0}={}){show(el,at);
 tl.fromTo(u,{opacity:0,scale:from,z:200},{opacity:1,scale:1,z:0,duration:dur,ease:'expo.out',stagger:st,immediateRender:false},at);blurT(el,at,22,0,dur*.7,'xy','power2.out');kick(at+.06,amp)}
function inLeft(u,el,at,{dur=.7,st=.02,dir=-1}={}){show(el,at);
 tl.fromTo(u,{opacity:0,xPercent:60*dir},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurT(el,at,40,0,dur*.8,'x')}
function inType(chars,el,at,dur){show(el,at);tl.fromTo(chars,{opacity:0},{opacity:1,duration:.01,stagger:dur/chars.length,immediateRender:false},at)}
function out(el,at,{x=0,y=0,z=0,scale,dur=.45,axis='y',blur=40,ease='power3.in',rot}={}){
 const v={x:`+=${x}`,y:`+=${y}`,z:`+=${z}`,opacity:0,duration:dur,ease};if(scale!==undefined)v.scale=scale;if(rot!==undefined)v.rotation=rot;tl.to(el,v,at);blurT(el,at,0,blur,dur,axis,'power2.in')}
function fvsT(el,at,dur,from,to,tmpl,ease='power2.inOut'){const o={v:from};
 tl.fromTo(o,{v:from},{v:to,duration:dur,ease,immediateRender:false,onUpdate(){el.style.fontVariationSettings=tmpl(o.v)}},at)}
const camTo=(at,dur,v,ease='sine.inOut')=>tl.to(cam,{...v,duration:dur,ease},at);
gsap.set(cam,{transformOrigin:'540px 960px'});

/* photo frames — whole photos, never cut out */
function polaroid(i,{x,y,w=500,h=620,rot=0,pos='50% 30%',z=0,tape=true}){const d=document.createElement('div');d.className='card';
 d.style.cssText+=`left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px`;
 const pad=w*.055,bot=h*.17;d.innerHTML=`<img src="${SRC(i)}" style="left:${pad}px;top:${pad}px;width:${w-pad*2}px;height:${h-pad-bot}px;object-position:${pos}">${tape?'<div class="tape"></div>':''}`;
 cam.appendChild(d);gsap.set(d,{rotation:rot,z});return d}
function sticker(i,{x,y,w=520,h=700,pos='50% 40%',z=0}){const d=document.createElement('div');d.className='stick';
 d.style.cssText+=`left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px`;d.innerHTML=`<img src="${SRC(i)}" style="object-position:${pos}">`;cam.appendChild(d);gsap.set(d,{z});return d}
function fragFrame(i,{x,y,w=520,h=680,cols=2,rows=3,seed=5,pos='50% 35%',z=0}){ // frame broken into fragments
 const box=document.createElement('div');box.style.cssText=`position:absolute;left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;opacity:0;transform-style:preserve-3d;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))`;
 cam.appendChild(box);gsap.set(box,{z});const r=rng(seed),V=[];
 for(let j=0;j<=rows;j++){V.push([]);for(let k=0;k<=cols;k++){let px=k/cols*w,py=j/rows*h;if(k>0&&k<cols)px+=(r()-.5)*.5*w/cols;if(j>0&&j<rows)py+=(r()-.5)*.5*h/rows;V[j].push([px,py])}}
 const pad=w*.05,frags=[];
 for(let j=0;j<rows;j++)for(let k=0;k<cols;k++){const poly=[V[j][k],V[j][k+1],V[j+1][k+1],V[j+1][k]];const f=document.createElement('div');f.className='frag';
  f.style.cssText+=`width:${w}px;height:${h}px;background:${PAPER};clip-path:polygon(${poly.map(p=>`${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(',')})`;
  f.innerHTML=`<img src="${SRC(i)}" style="position:absolute;left:${pad}px;top:${pad}px;width:${w-pad*2}px;height:${h-pad*2}px;object-fit:cover;object-position:${pos}">`;
  box.appendChild(f);const cx=poly.reduce((a,p)=>a+p[0],0)/4,cy=poly.reduce((a,p)=>a+p[1],0)/4;gsap.set(f,{transformOrigin:`${cx}px ${cy}px`});frags.push({el:f,cx,cy,w,h})}
 return{box,frags}}
function svgEl(w=1080,h=1920,z=0){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w);s.setAttribute('height',h);s.style.cssText='position:absolute;left:0;top:0;overflow:visible';cam.appendChild(s);gsap.set(s,{z});return s}

/* ================= S1 — "And I wanted it, I wanted it bad" ================= */
tl.fromTo(cam,{scale:1.14,rotationX:12,y:40},{scale:1,rotationX:3,y:0,duration:1.6,ease:'power2.out'},0);
const s1a=line('And I wanted it,',{y:470,font:'Fraunces',size:92,w:400,fvs:"'opsz' 72,'SOFT' 50"});
[.42,.72,.96,1.44].forEach((t,i)=>inDim(s1a.words[i],s1a.el,t));
const s1b=line('I wanted it',{y:600,font:'Fraunces',size:92,w:400,fvs:"'opsz' 72,'SOFT' 50"});
inRise(s1b.wc[0],s1b.el,1.72);inRise(s1b.wc[1],s1b.el,1.88);inRise(s1b.wc[2],s1b.el,2.32);
const s1c=line('bad',{y:830,font:'Fraunces',size:340,w:900,it:1,fvs:"'opsz' 144,'SOFT' 100,'WONK' 1",css:'text-shadow:0 18px 40px rgba(0,0,0,.45)'});
inSquash(s1c.chars,s1c.el,2.64,{st:.06});kick(2.7,8);
const pol4=polaroid(4,{x:560,y:1380,w:470,h:600,rot:-5,pos:'40% 30%'});
tl.fromTo(pol4,{opacity:0,y:700,rotation:14,scaleY:1.3},{opacity:1,y:0,rotation:-5,scaleY:1,duration:1.1,ease:'elastic.out(1,.5)',immediateRender:false},.95);
tl.to(pol4,{rotation:3,duration:2.2,ease:'sine.inOut'},2.1);
camTo(1.6,2.6,{rotationY:-7,rotationX:0,scale:1.05});
[s1a,s1b,s1c].forEach((L,i)=>out(L.el,4.2+i*.04,{y:-480,dur:.4,blur:40}));
tl.to(pol4,{rotationY:90,x:'+=260',opacity:0,duration:.45,ease:'power3.in'},4.2);

/* ================= S2 — "But there were so many red flags" ================= */
tl.set(cam,{rotationY:12,rotationX:0,scale:1.02},4.5);camTo(4.5,2.6,{rotationY:-4,scale:1.06});
const s2a=line('But there were so many',{y:520,font:'Archivo',size:84,w:600,fvs:"'wdth' 80"});
[4.56,4.82,5.14,5.28,5.52].forEach((t,i)=>inRise(s2a.wc[i],s2a.el,t,{st:.025}));
const s2b=line('red flags',{y:720,font:'Archivo',size:230,w:900,color:RED,fvs:"'wdth' 62",css:`text-transform:uppercase;text-shadow:${ext('#7d1426',12)}`});
inSlam(s2b.wc[0],s2b.el,5.90,{amp:10});inSlam(s2b.wc[1],s2b.el,6.34,{amp:14});
const p1red=polaroid(1,{x:540,y:1320,w:440,h:560,rot:4,pos:'50% 25%',tape:false});
p1red.querySelector('img').style.filter='grayscale(1) contrast(1.15)';
const redOv=document.createElement('div');redOv.style.cssText=`position:absolute;inset:0;background:${RED};mix-blend-mode:multiply;opacity:.85`;p1red.appendChild(redOv);
tl.fromTo(p1red,{opacity:0,scale:.6,rotation:-12},{opacity:1,scale:1,rotation:4,duration:.9,ease:'elastic.out(1,.55)',immediateRender:false},5.0);
// waving flags (path animated in render)
const flagSvg=svgEl(1080,1920,-80);flagSvg.style.opacity=0;
flagSvg.innerHTML=[0,1,2].map(k=>`<g class="fpos"><g class="flag"><line x1="0" y1="0" x2="0" y2="520" stroke="${PAPER}" stroke-width="7" stroke-linecap="round"/><path fill="${RED}" stroke="#7d1426" stroke-width="2"/></g></g>`).join('');
const flags=[...flagSvg.querySelectorAll('.flag')],FLAGPOS=[[130,1080],[900,1000],[790,1560]];
[...flagSvg.querySelectorAll('.fpos')].forEach((g,k)=>g.setAttribute('transform',`translate(${FLAGPOS[k][0]},${FLAGPOS[k][1]})`));
tl.set(flagSvg,{opacity:1},5.85);
tl.fromTo(flags,{y:700},{y:0,duration:.8,ease:'back.out(1.4)',stagger:.12,immediateRender:false},5.85);

/* ================= S3 (paper) — "Now another one bites the dust" ================= */
const WIPE1=[7.05,7.7];
[s2a,s2b].forEach(L=>out(L.el,7.0,{x:900,dur:.55,axis:'x',blur:50}));
tl.to([p1red,flagSvg],{x:'+=1000',opacity:0,duration:.55,ease:'power3.in'},7.0);
tl.set(cam,{rotationY:0,rotationX:8,scale:1,x:0},7.6);camTo(7.6,3.2,{rotationX:0,rotationZ:-2,scale:1.05});
const s3a=line('Now another one bites the',{y:740,font:'Archivo',size:78,w:500,color:NAVY,fvs:"'wdth' 100"});
[7.62,8.06,8.62,9.04,9.44].forEach((t,i)=>inLeft(s3a.wc[i],s3a.el,t,{dir:1}));
const s3b=line('dust',{y:960,font:'Archivo',size:330,w:900,color:NAVY,fvs:"'wdth' 125",css:`text-shadow:${ext('#c9bfb2',10)}`});
inSlam(s3b.chars,s3b.el,9.84,{from:1.8,amp:12,st:.04});
tl.to(s3b.chars,{x:(i)=>60+i*40,y:(i)=>-30-i*12,opacity:0,duration:1.1,ease:'power2.in',stagger:.08},10.55);blurT(s3b.el,10.55,0,26,1.3,'x','power2.in');
out(s3a.el,11.2,{y:-300,dur:.45});

/* ================= S4 (paper) — "Yeah, let's be clear, I trust no one" ================= */
const s4a=line("Yeah, let’s be clear,",{y:520,font:'DM Mono',size:60,w:400,color:NAVY});inType(s4a.chars,s4a.el,11.94,.95);
const s4b=line('I trust no one',{y:660,font:'DM Mono',size:96,w:500,color:NAVY});
const s4bw=s4b.wc;[[0,13.0],[1,13.24],[2,13.5],[3,13.94]].forEach(([k,t])=>inType(s4bw[k],s4b.el,t,.12*s4bw[k].length));
const strike=document.createElement('div');strike.style.cssText=`position:absolute;left:0;right:-6px;top:52%;height:9px;background:${RED};transform-origin:0 50%;transform:scaleX(0)`;
s4b.words[1].style.position='relative';s4b.words[1].appendChild(strike);
tl.to(strike,{scaleX:1,duration:.3,ease:'power3.out'},13.62);
tl.to(s4b.words[1],{y:46,rotation:6,duration:.6,ease:'bounce.out'},13.9);
const fr1=fragFrame(1,{x:540,y:1250,w:480,h:640,cols:3,rows:1,seed:9,pos:'50% 25%'});
tl.set(fr1.box,{opacity:1},12.0);
tl.fromTo(fr1.frags.map(f=>f.el),{y:(i)=>(i%2?-1:1)*900,opacity:0},{y:0,opacity:1,duration:.8,ease:'expo.out',stagger:.12,immediateRender:false},12.0);
tl.to(fr1.frags.map(f=>f.el),{x:(i)=>(i-1)*26,y:(i)=>(i%2?-1:1)*14,duration:.6,ease:'power2.out'},13.3);
camTo(11.8,2.6,{rotationY:6,rotationZ:1,scale:1.08});
[s4a,s4b].forEach(L=>out(L.el,14.45,{x:-700,dur:.4,axis:'x',blur:50}));
tl.to(fr1.frags.map(f=>f.el),{x:(i)=>`-=${700+i*80}`,opacity:0,duration:.45,ease:'power3.in',stagger:.03},14.45);
camTo(14.45,.4,{rotationY:-18,x:-120},'power2.in');

/* ================= S5 (navy) — "You did not break me" + elastic band on "me" ================= */
tl.set(cam,{rotationY:14,x:110,rotationZ:0,rotationX:0,scale:1},14.9);camTo(14.9,.9,{rotationY:0,x:0},'expo.out');

/* ---------- procedural layers ---------- */
const tiles=[0,1,2].map(s=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),im=x.createImageData(256,256);
 for(let i=0;i<256*256;i++){const v=hash(i%256,i>>8,s+40)*255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255}x.putImageData(im,0,0);return`url(${c.toDataURL()})`});
const grain=$('#grain'),bgC=$('#bgCream'),bgH=$('#bgHeart'),sfx=$('#stageFx').getContext('2d');
const fxc=document.createElement('canvas');fxc.width=1080;fxc.height=1920;fxc.style.cssText='position:absolute;left:0;top:0;pointer-events:none';cam.appendChild(fxc);gsap.set(fxc,{z:50});const fxx=fxc.getContext('2d');
function creamClip(t){
 if(t<WIPE1[0])return'polygon(0 0,0 0,0 0)';
 if(t<WIPE1[1]){const k=eio((t-WIPE1[0])/(WIPE1[1]-WIPE1[0])),e=-200+k*1500;let pts=['0px 0px'];
  for(let y=0;y<=1920;y+=80)pts.push(`${(e+Math.sin(y/140+t*14)*55).toFixed(0)}px ${y}px`);pts.push('0px 1920px');return`polygon(${pts.join(',')})`}
 if(t<14.45)return'inset(0 0 0 0)';
 if(t<14.9){const k=eio((t-14.45)/.45);return`inset(0 0 0 ${(k*100).toFixed(2)}%)`}
 if(t<28.55)return'polygon(0 0,0 0,0 0)';
 if(t<33.2)return'inset(0 0 0 0)';
 if(t<33.55){const k=eio((t-33.2)/.35),o=k*2400;return`polygon(${-200+o}px 0px,1080px 0px,1080px 1920px,${-1400+o}px 1920px)`}
 if(t<SNAP)return'polygon(0 0,0 0,0 0)';
 if(t<SNAP+.5){const k=1-Math.pow(1-(t-SNAP)/.5,3);return`circle(${(k*1500).toFixed(0)}px at 540px 860px)`}
 if(t<51.0)return'inset(0 0 0 0)';return'polygon(0 0,0 0,0 0)'}
function wave(t,k){const L=300,H=190,phase=t*7+k*1.7,amp=26;let top=[],bot=[];
 for(let i=0;i<=12;i++){const x=i/12*L,f=x/L,dy=Math.sin(x/70-phase)*amp*f;top.push(`${x.toFixed(1)},${(dy).toFixed(1)}`);bot.unshift(`${x.toFixed(1)},${(H+dy*1.1).toFixed(1)}`)}
 return`M${top.join(' L')} L${bot.join(' L')}Z`}
function render(t){
 const fi=Math.floor(t*15);grain.style.backgroundImage=tiles[fi%3];grain.style.backgroundPosition=`${(hash(fi,1,9)*256)|0}px ${(hash(fi,2,9)*256)|0}px`;
 bgC.style.clipPath=creamClip(t);
 if(t>=HEART_IN[0]){const k=clamp((t-HEART_IN[0])/(HEART_IN[1]-HEART_IN[0]));bgH.style.opacity=1;bgH.style.webkitMaskSize=`${(eio(k)*5200).toFixed(0)}px`}else{bgH.style.opacity=0}
 let sx=0,sy=0,sr=0;for(const [ti,a] of impulses){const d=t-ti;if(d>=0&&d<1.1){const e=a*Math.exp(-d*7.5);sx+=e*Math.sin(d*63+ti);sy+=e*Math.cos(d*55+ti*2);sr+=e*.05*Math.sin(d*41)}}
 if(t>38.0&&t<SNAP){const k=(t-38)/(SNAP-38),a=k*k*7;sx+=a*Math.sin(t*97);sy+=a*Math.cos(t*83)}
 shake.style.transform=`translate3d(${(sx+Math.sin(t*.53)*6).toFixed(2)}px,${(sy+Math.cos(t*.41)*5).toFixed(2)}px,0) rotate(${(sr+Math.sin(t*.8)*.25).toFixed(3)}deg)`;
 $('#blobA').style.translate=`${(Math.sin(t*.21)*120).toFixed(1)}px ${(Math.cos(t*.17)*160).toFixed(1)}px`;$('#blobB').style.translate=`${(Math.cos(t*.19)*140).toFixed(1)}px ${(Math.sin(t*.23)*120).toFixed(1)}px`;
 // flags
 if(t>5.8&&t<7.7)flags.forEach((g,k)=>g.querySelector('path').setAttribute('d',wave(t,k)));
 // elastic band on "me"
 if(t>16.8&&t<21.6){let pull;if(t<RELEASE){const k=clamp((t-16.94)/(RELEASE-16.94));pull=380*Math.pow(k,1.6)}else{const d=t-RELEASE;pull=380*Math.exp(-d*4.2)*Math.cos(d*24)}
  bandP.setAttribute('d',`M70,1180 Q540,${(1180+pull).toFixed(1)} 1010,1180`);const off=pull/2;meWrap.style.transform=`translateY(${off.toFixed(1)}px) scaleY(${(1+Math.max(0,off)/700).toFixed(3)})`;meWrap.style.transformOrigin='540px 1180px'}
 else meWrap.style.transform='none';
 // rubber bands pulling the photo
 if(t>37.9&&t<SNAP){const k=clamp((t-38)/(SNAP-38));const sx2=1+.32*Math.pow(k,1.6),hw=235*sx2;
  rbl[0].setAttribute('d',`M${540-hw},1000 Q${(300-hw*.4).toFixed(0)},${(960-k*40).toFixed(0)} ${-10},${900}`);rbl[1].setAttribute('d',`M${540+hw},1300 Q${(780+hw*.4).toFixed(0)},${(1340+k*40).toFixed(0)} ${1090},${1400}`)}
 // neon flicker
 if(t>22.6&&t<28.3){const f=t<24?(hash(Math.floor(t*20),3,4)>.25?1:.35):.85+.15*Math.sin(t*13);neon.style.opacity=f.toFixed(2)}
 // heart beat pulse
 if(t>51.9){const ph=(((t-PH)/BEAT)%1+1)%1,p=Math.exp(-ph*5.5);const grow=clamp((t-51.9)/1.2);const s=(.25+.75*(1-Math.pow(1-grow,3)));
  hrtS.setAttribute('transform',`scale(${(s*(1+.05*p)).toFixed(4)},${(s*(1+.035*p)).toFixed(4)})`)}
 // particles
 fxx.clearRect(0,0,1080,1920);sfx.clearRect(0,0,1080,1920);
 if(t>10.5&&t<13.2){for(let i=0;i<260;i++){const tb=10.5+hash(i,1,3)*1.3,a=t-tb;if(a<0||a>1.6)continue;const x0=300+hash(i,2,3)*480,y0=860+hash(i,3,3)*200;
   const x=x0+(60+hash(i,4,3)*220)*a+Math.sin(a*6+i)*12,y=y0-(20+hash(i,5,3)*80)*a;fxx.globalAlpha=(1-a/1.6)*.8;fxx.fillStyle=hash(i,6,3)>.5?'#0E1A2E':'#6f6a63';
   const sz=1.5+hash(i,7,3)*4;fxx.fillRect(x,y,sz,sz)}}
 if(t>42.4&&t<43.9){sfx.strokeStyle='rgba(14,26,46,.55)';for(let i=0;i<26;i++){const y=900+hash(i,1,6)*420,sp=2600+hash(i,2,6)*2000,ph=hash(i,3,6);
   const x=1300-((t-42.4+ph)*sp)%1800,L=120+hash(i,4,6)*300;sfx.lineWidth=1+hash(i,5,6)*3;sfx.globalAlpha=.6;sfx.beginPath();sfx.moveTo(x,y);sfx.lineTo(x+L,y);sfx.stroke()}}
 if(t>24.5&&t<28.6){for(let i=0;i<60;i++){const tb=24.5+hash(i,1,8)*3.5,a=t-tb;if(a<0||a>2.4)continue;const x=200+hash(i,2,8)*680+Math.sin(a*2+i)*20,y=1000-a*(60+hash(i,3,8)*80);
   fxx.globalAlpha=Math.sin(Math.PI*a/2.4)*.8;fxx.fillStyle='#b9c8ff';fxx.beginPath();fxx.arc(x,y,1.5+hash(i,4,8)*2.5,0,6.283);fxx.fill()}}
 if(t>52.0){for(let i=0;i<70;i++){const span=DUR-52,tb=52+hash(i,1,12)*span,a=t-tb;if(a<0||a>3)continue;const x=hash(i,2,12)*1080+Math.sin(a*1.6+i)*24,y=1820-a*(120+hash(i,3,12)*160);
   fxx.globalAlpha=Math.sin(Math.PI*a/3)*.75;fxx.fillStyle=hash(i,4,12)>.6?'#ffb3bd':RED;const s=4+hash(i,5,12)*7;
   fxx.save();fxx.translate(x,y);fxx.rotate(Math.sin(a*2+i)*.4);fxx.scale(s/10,s/10);fxx.beginPath();fxx.moveTo(0,4);fxx.bezierCurveTo(-8,-2,-6,-9,0,-5);fxx.bezierCurveTo(6,-9,8,-2,0,4);fxx.fill();fxx.restore()}}
 fxx.globalAlpha=1;sfx.globalAlpha=1;
}
