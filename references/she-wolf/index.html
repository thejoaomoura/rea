<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>She Wolf Lyric</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--ink:#28161F;--cream:#EFE8DD;--gold:#D9B55B}
html,body{margin:0;height:100%;background:#120a0e;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--cream)}
.full{position:absolute;inset:0}
#bgCream{background:
  radial-gradient(120% 70% at 50% 42%,#f6f1e8 0%,#efe8dd 45%,#e2d6c6 100%),var(--cream)}
#bgCream::after{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 40% at 18% 12%,rgba(217,181,91,.14),transparent 70%),
  radial-gradient(55% 35% at 85% 88%,rgba(40,22,31,.10),transparent 70%)}
#bgInk{background:
  radial-gradient(90% 60% at 50% 45%,#3d2331 0%,#28161F 55%,#170b11 100%);clip-path:inset(50% 0 50% 0)}
#bgInk::after{content:"";position:absolute;inset:0;background:
  radial-gradient(50% 30% at 50% 50%,rgba(217,181,91,.16),transparent 70%)}
#inkGlow{opacity:0;background:radial-gradient(45% 28% at 50% 50%,rgba(240,200,110,.32),transparent 72%)}
#ghost{overflow:hidden;pointer-events:none}
.gh{position:absolute;left:-200px;white-space:nowrap;font-family:'Syne';font-weight:800;font-size:430px;line-height:.9;
  color:rgba(120,90,104,.20);-webkit-text-fill-color:transparent;-webkit-text-stroke:2px currentColor;letter-spacing:-.02em}
#dust{position:absolute;left:0;top:0}
#world{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
#shake,#cam{position:absolute;inset:0;transform-style:preserve-3d}
.ln{position:absolute;white-space:nowrap;line-height:1;transform-style:preserve-3d;opacity:0}
.wd{display:inline-block;transform-style:preserve-3d}
.ch{display:inline-block}
.gw{position:absolute;opacity:0;filter:drop-shadow(0 0 26px rgba(217,181,91,.33)) drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.gw img{display:block}
#lockPos{position:absolute;left:0;top:0;transform-style:preserve-3d}
#lockWrap{position:absolute;left:0;top:0;perspective:1300px;filter:drop-shadow(0 0 30px rgba(217,181,91,.35)) drop-shadow(0 12px 16px rgba(0,0,0,.55))}
.shard{position:absolute;left:0;top:0;opacity:0;backface-visibility:visible}
#crackGlow{position:absolute;left:0;top:0;opacity:0;mix-blend-mode:screen;filter:blur(1.2px) drop-shadow(0 0 10px #ffd67a)}
.row{position:absolute;left:540px;white-space:nowrap;font-family:'Barlow Condensed';font-weight:800;font-size:250px;line-height:1;
  text-transform:uppercase;color:var(--cream);-webkit-text-fill-color:transparent;-webkit-text-stroke:3px currentColor;opacity:0}
#eyes{position:absolute;left:540px;top:690px;width:820px;height:200px;opacity:0;filter:drop-shadow(0 0 28px rgba(217,181,91,.55))}
#grain{mix-blend-mode:overlay;opacity:.42;pointer-events:none}
#vign{pointer-events:none;background:radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(23,10,16,.38) 100%)}
#flash{pointer-events:none;opacity:0;background:radial-gradient(60% 40% at 50% 50%,#fff6dc,rgba(255,230,160,.6) 45%,rgba(255,220,140,0) 80%)}
#sheen{pointer-events:none;opacity:0;mix-blend-mode:overlay;
  background:linear-gradient(105deg,transparent 35%,rgba(255,248,220,.85) 50%,transparent 65%);background-size:300% 100%}
#fade{background:#170b11;opacity:0;pointer-events:none}
#wm{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:'Space Grotesk';font-weight:500;font-size:30px;
  letter-spacing:.16em;color:var(--cream);mix-blend-mode:difference;opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgCream" class="full"></div>
  <div id="bgInk" class="full"></div>
  <div id="inkGlow" class="full"></div>
  <div id="ghost" class="full"><div class="gh" id="gh1" style="top:180px">she wolf she wolf</div><div class="gh" id="gh2" style="top:1330px">wolf she wolf she</div></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="world"><div id="shake"><div id="cam"></div></div></div>
  <canvas id="frost" width="1080" height="1920" class="full"></canvas>
  <div id="sheen" class="full"></div>
  <div id="flash" class="full"></div>
  <div id="grain" class="full"></div>
  <div id="vign" class="full"></div>
  <div id="fade" class="full"></div>
  <div id="wm">@moura’slyrics</div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<template id="wolfTpl"><!-- paste wolf.svg here (vectorized from public-domain Wikimedia "Howlsnow.jpg" via tools/seg.py + tools/trace.py) --></template>
<audio id="aud" src="assets/chorus.mp3" preload="auto"></audio>
<script src="assets/gsap.min.js"></script>
<script>
(async()=>{
/* ---------- constants: video time = song time - 35.9 ---------- */
const DUR=52.2, BEAT=0.464399, PH=36.3715-35.9, DROP=45.05, DROP_END=52.2;
const INK='#28161F', CREAM='#EFE8DD', GOLD='#D9B55B';
const $=s=>document.querySelector(s);
const stage=$('#stage'), cam=$('#cam'), shake=$('#shake'), fx=$('#fx');
const params=new URLSearchParams(location.search), CLEAN=params.has('clean');
function fit(){const k=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(${(innerWidth-1080*k)/2}px,${(innerHeight-1920*k)/2}px) scale(${k})`}
fit();addEventListener('resize',fit);

await Promise.all([
 "600 40px 'Barlow Condensed'","800 40px 'Barlow Condensed'","40px 'Instrument Serif'","italic 40px 'Instrument Serif'",
 "400 40px 'Space Grotesk'","500 40px 'Space Grotesk'","600 40px 'Space Grotesk'","800 40px 'Syne'","40px 'Italianno'",
 "italic 900 40px 'Playfair Display'"].map(f=>document.fonts.load(f)));
await document.fonts.ready;

/* ---------- deterministic noise ---------- */
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(x,y,cell,s){const gx=Math.floor(x/cell),gy=Math.floor(y/cell),fx=x/cell-gx,fy=y/cell-gy;
 const a=hash(gx,gy,s),b=hash(gx+1,gy,s),c=hash(gx,gy+1,s),d=hash(gx+1,gy+1,s);const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
 return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy}

/* ---------- gold cracked word asset (canvas, seeded) ---------- */
const DPR=2;
function goldWord(text,{size=250,seed=7,level=1,font=`italic 900 ${size}px "Playfair Display"`}={}){
 const mc=document.createElement('canvas').getContext('2d');mc.font=font;const mt=mc.measureText(text);
 const pad=size*.16, asc=mt.actualBoundingBoxAscent, desc=mt.actualBoundingBoxDescent;
 const w=Math.ceil(mt.actualBoundingBoxLeft+mt.actualBoundingBoxRight+pad*2), h=Math.ceil(asc+desc+pad*2);
 const ox=pad+mt.actualBoundingBoxLeft, oy=pad+asc;
 const c=document.createElement('canvas');c.width=w*DPR;c.height=h*DPR;const x=c.getContext('2d');x.scale(DPR,DPR);x.font=font;
 const g=x.createLinearGradient(0,oy-asc,0,oy+desc);
 [[0,'#7a5718'],[.22,'#D9B55B'],[.42,'#fbebb4'],[.55,'#d4a948'],[.78,'#8e6520'],[1,'#e3c26e']].forEach(([o,c])=>g.addColorStop(o,c));
 x.fillStyle=g;x.fillText(text,ox,oy);
 x.globalCompositeOperation='source-atop';
 const g2=x.createLinearGradient(0,0,w,h*.7);g2.addColorStop(.30,'rgba(255,246,214,0)');g2.addColorStop(.44,'rgba(255,246,214,.38)');g2.addColorStop(.56,'rgba(255,246,214,0)');
 x.fillStyle=g2;x.fillRect(0,0,w,h);
 x.lineJoin='round';x.lineWidth=size*.02;
 x.strokeStyle='rgba(255,244,205,.6)';x.strokeText(text,ox-size*.007,oy-size*.009);
 x.strokeStyle='rgba(60,38,8,.6)';x.strokeText(text,ox+size*.011,oy+size*.013);
 // texture: fine grain + worn blotches + brushed rows
 const id=x.getImageData(0,0,c.width,c.height),d=id.data,W=c.width,H=c.height;
 const alpha=new Uint8Array(W*H);
 for(let yy=0;yy<H;yy++){const row=(hash(0,yy,seed+3)-.5)*12;for(let xx=0;xx<W;xx++){const i=(yy*W+xx);const a=d[i*4+3];alpha[i]=a;if(!a)continue;
  const n=(hash(xx,yy,seed)-.5)*34+(vnoise(xx,yy,46,seed+1)-.5)*52+(vnoise(xx,yy,9,seed+2)-.5)*18+row;
  d[i*4]=Math.max(0,Math.min(255,d[i*4]+n));d[i*4+1]=Math.max(0,Math.min(255,d[i*4+1]+n*.92));d[i*4+2]=Math.max(0,Math.min(255,d[i*4+2]+n*.7));}}
 x.putImageData(id,0,0);
 const opaque=(lx,ly)=>{const X=Math.round(lx*DPR),Y=Math.round(ly*DPR);return X>=0&&Y>=0&&X<W&&Y<H&&alpha[Y*W+X]>140};
 const edgeY=(lx,fromTop)=>{if(fromTop){for(let y=0;y<h;y+=1)if(opaque(lx,y))return y}else{for(let y=h-1;y>=0;y-=1)if(opaque(lx,y))return y}return null};
 const r=rng(seed*97+11), s=size/250, cracks=[], bites=[];
 const x0=ox-mt.actualBoundingBoxLeft, x1=ox+mt.actualBoundingBoxRight;
 for(let k=0;k<10;k++){ // cracks from glyph edges inward
  let px=x0+(x1-x0)*(.06+.88*r()), top=r()<.55, py=edgeY(px,top); if(py==null){k--;continue}
  let ang=(top?Math.PI/2:-Math.PI/2)+(r()-.5)*1.3; const pts=[[px,py]]; const segs=5+Math.floor(r()*6);
  for(let i=0;i<segs;i++){ang+=(r()-.5)*1.25;const L=(9+r()*20)*s;px+=Math.cos(ang)*L;py+=Math.sin(ang)*L;pts.push([px,py])}
  const br=[];if(r()<.5){const j=1+Math.floor(r()*(pts.length-2));let [bx,by]=pts[j],ba=ang+(r()<.5?1:-1)*(.7+r()*.6);br.push([bx,by]);
   for(let i=0;i<3+Math.floor(r()*3);i++){ba+=(r()-.5)*1.1;const L=(8+r()*14)*s;bx+=Math.cos(ba)*L;by+=Math.sin(ba)*L;br.push([bx,by])}}
  cracks.push([pts,br]);
 }
 for(let k=0;k<10;k++){ const px=x0+(x1-x0)*(.04+.92*r()), top=r()<.5, py=edgeY(px,top); if(py==null){k--;continue}
  const R=(11+r()*15)*s, n=9, poly=[];const cy=py+(top?-R*.25:R*.25);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+r()*.3, rr=R*(.55+r()*.65);poly.push([px+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
  bites.push(poly);
 }
 const nC=[0,2,4,6,9][level], nB=[0,2,4,6,9][level];
 const path=(pts)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b))};
 x.lineCap='round';x.lineJoin='round';
 for(let k=0;k<nC;k++)for(const pts of cracks[k]){if(!pts.length)continue;
  x.globalCompositeOperation='source-atop';
  x.save();x.translate(1.4*s,1.6*s);path(pts);x.strokeStyle='rgba(48,28,6,.85)';x.lineWidth=5.5*s;x.stroke();x.restore();
  x.save();x.translate(-1.1*s,-1.1*s);path(pts);x.strokeStyle='rgba(255,243,200,.75)';x.lineWidth=3.6*s;x.stroke();x.restore();
  x.globalCompositeOperation='destination-out';path(pts);x.lineWidth=2.6*s;x.stroke();}
 for(let k=0;k<nB;k++){const p=bites[k];
  x.globalCompositeOperation='source-atop';x.save();x.translate(1.5*s,1.5*s);path(p);x.closePath();x.strokeStyle='rgba(45,26,5,.8)';x.lineWidth=6*s;x.stroke();x.restore();
  x.globalCompositeOperation='destination-out';path(p);x.closePath();x.fill();}
 // glow-only crack overlay
 const gc=document.createElement('canvas');gc.width=W;gc.height=H;const gx=gc.getContext('2d');gx.scale(DPR,DPR);gx.lineCap='round';gx.lineJoin='round';
 gx.strokeStyle='#fff3c8';gx.shadowColor='#ffcf6b';gx.shadowBlur=10*s;gx.lineWidth=2.4*s;
 for(let k=0;k<nC;k++)for(const pts of cracks[k]){if(!pts.length)continue;gx.beginPath();pts.forEach(([a,b],i)=>i?gx.lineTo(a,b):gx.moveTo(a,b));gx.stroke()}
 return {c,gc,w,h,oy,alpha};
}

/* ---------- builders ---------- */
let fid=0;
function blurFilter(){const id='mb'+(fid++);const f=document.createElementNS('http://www.w3.org/2000/svg','filter');
 f.setAttribute('id',id);f.setAttribute('x','-80%');f.setAttribute('y','-80%');f.setAttribute('width','260%');f.setAttribute('height','260%');
 const b=document.createElementNS('http://www.w3.org/2000/svg','feGaussianBlur');b.setAttribute('stdDeviation','0 0');f.appendChild(b);fx.appendChild(f);return{id,b}}
const tl=gsap.timeline({paused:true});
function blurT(el,at,from,to,dur,axis='y',ease='power3.out'){const {id,b}=blurFilter();const o={v:from};
 tl.fromTo(o,{v:from},{v:to,duration:dur,ease,immediateRender:false,onUpdate(){const v=o.v;
  if(v<.2){el.style.filter='none';return}
  b.setAttribute('stdDeviation',axis==='y'?`${(v*.07).toFixed(2)} ${v.toFixed(2)}`:axis==='x'?`${v.toFixed(2)} ${(v*.07).toFixed(2)}`:`${(v*.6).toFixed(2)} ${(v*.6).toFixed(2)}`);
  el.style.filter=`url(#${id})`;}},at)}
function ext(col,n=14,dx=.8,dy=1.05,soft='rgba(0,0,0,.25)'){let a=[];for(let i=1;i<=n;i++)a.push(`${(i*dx).toFixed(1)}px ${(i*dy).toFixed(1)}px 0 ${col}`);a.push(`${n*dx+6}px ${n*dy+14}px 26px ${soft}`);return a.join(',')}
function line(txt,o){const el=document.createElement('div');el.className='ln';
 el.style.cssText=`left:${o.x??540}px;top:${o.y}px;font-family:'${o.font}';font-size:${o.size}px;font-weight:${o.w??500};font-style:${o.it?'italic':'normal'};letter-spacing:${o.ls??0}em;color:${o.color??INK};${o.css??''}`;
 const words=[],chars=[];txt.split(' ').forEach((w,i)=>{if(i)el.appendChild(document.createTextNode(' '));const wd=document.createElement('span');wd.className='wd';
  [...w].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch;wd.appendChild(s);chars.push(s)});el.appendChild(wd);words.push(wd)});
 (o.parent??cam).appendChild(el);gsap.set(el,{xPercent:-50,yPercent:-50,z:o.z??0});
 const wc=words.map(w=>[...w.children]);return{el,words,chars,wc}}
function goldEl(asset,{x=540,y,scale=1}){const d=document.createElement('div');d.className='gw';const im=new Image();im.src=asset.c.toDataURL();
 im.style.width=asset.w*scale+'px';im.style.height=asset.h*scale+'px';d.appendChild(im);d.style.left=x+'px';d.style.top=y+'px';cam.appendChild(d);
 gsap.set(d,{xPercent:-50,yPercent:-50});return{el:d,img:im}}
const show=(el,at)=>tl.set(el,{opacity:1},at);
const impulses=[];const kick=(t,a)=>impulses.push([t,a]);

/* entry / exit vocabulary */
function inRise(units,el,at,{dur=.9,st=.035,yp=75,sy=1.6,blur=28}={}){show(el,at);
 tl.fromTo(units,{opacity:0,yPercent:yp,scaleY:sy,transformOrigin:'50% 100%'},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurT(el,at,blur,0,dur*.85,'y')}
function inDim(units,el,at,{dur=.85,y=34,blur=16}={}){show(el,at);
 tl.fromTo(units,{opacity:0,y},{opacity:1,y:0,duration:dur,ease:'power3.out',immediateRender:false},at);blurT(el,at,blur,0,dur*.8,'y')}
function inSlam(units,el,at,{from=2.4,dur=.55,amp=12,st=0}={}){show(el,at);
 tl.fromTo(units,{opacity:0,scale:from,z:200},{opacity:1,scale:1,z:0,duration:dur,ease:'expo.out',stagger:st,immediateRender:false},at);blurT(el,at,22,0,dur*.7,'xy','power2.out');kick(at+.06,amp)}
function inFlip(units,el,at,{dur=.75,st=.04}={}){show(el,at);
 tl.fromTo(units,{opacity:0,rotationX:-105,transformOrigin:'50% 50% -60px'},{opacity:1,rotationX:0,duration:dur,ease:'back.out(1.5)',stagger:st,immediateRender:false},at);blurT(el,at,18,0,dur*.6,'y')}
function inDrop(units,el,at,{dur=.75,st=.05,seed=3}={}){show(el,at);const r=rng(seed);
 tl.fromTo(units,{opacity:0,yPercent:-240,rotation:()=>(r()-.5)*50},{opacity:1,yPercent:0,rotation:0,duration:dur,ease:'back.out(1.9)',stagger:st,immediateRender:false},at);blurT(el,at,26,0,dur*.6,'y')}
function inFreeze(units,el,at,{dur=1.1,st=.06,seed=5}={}){show(el,at);const r=rng(seed);
 tl.fromTo(units,{opacity:0,scale:1.35,rotation:()=>(r()-.5)*26,y:()=>(r()-.5)*60},{opacity:1,scale:1,rotation:0,y:0,duration:dur,ease:'expo.out',stagger:st,immediateRender:false},at);blurT(el,at,20,0,dur*.7,'xy')}
function inLeft(units,el,at,{dur=.75,st=.025}={}){show(el,at);
 tl.fromTo(units,{opacity:0,xPercent:-60},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurT(el,at,40,0,dur*.8,'x')}
function out(el,at,{x=0,y=0,z=0,scale,dur=.45,axis='y',blur=40,ease='power3.in'}={}){
 const v={x:`+=${x}`,y:`+=${y}`,z:`+=${z}`,opacity:0,duration:dur,ease};if(scale!==undefined)v.scale=scale;tl.to(el,v,at);blurT(el,at,0,blur,dur,axis,'power2.in')}
function fall(el,at,{dir=1,dur=1.0}={}){tl.to(el,{y:'+=1150',rotation:28*dir,x:`+=${90*dir}`,duration:dur,ease:'power2.in'},at);
 tl.to(el,{opacity:0,duration:.35,ease:'none'},at+dur-.35);blurT(el,at+.15,0,30,dur-.15,'y','power2.in')}
const camTo=(at,dur,v,ease='sine.inOut')=>tl.to(cam,{...v,duration:dur,ease},at);
gsap.set(cam,{transformOrigin:'540px 960px',transformPerspective:0});

/* ================= TIMELINE ================= */
// INTRO 0–2
tl.set('#bgInk',{clipPath:'inset(50% 0% 50% 0%)'},0);
tl.fromTo(cam,{scale:1.16,rotationX:16,y:60,rotationY:10},{scale:1,rotationX:6,y:0,rotationY:10,duration:2.2,ease:'power2.out'},0);
const hair=document.createElement('div');hair.style.cssText=`position:absolute;left:140px;top:959px;width:800px;height:2px;background:${GOLD};transform-origin:0 50%`;cam.appendChild(hair);
tl.fromTo(hair,{scaleX:0,opacity:1},{scaleX:1,duration:1.3,ease:'power3.inOut',immediateRender:true},.3);
tl.to(hair,{scaleX:0,transformOrigin:'100% 50%',duration:.5,ease:'power3.in'},1.6);

// A — "You loved me / in that / frozen / time"
const A1=line('You loved me',{y:650,font:'Space Grotesk',size:128,w:500});
[2.0,2.38,2.86].forEach((t,i)=>inDim(A1.words[i],A1.el,t));
const A2=line('in that',{y:805,font:'Space Grotesk',size:72,w:400,ls:.04});
inRise(A2.wc[0],A2.el,3.30,{st:.05});inRise(A2.wc[1],A2.el,4.42,{st:.05});
const A3=line('frozen',{y:995,font:'Instrument Serif',size:310,it:1,ls:-.01});inFreeze(A3.chars,A3.el,4.68);
const A4=line('time',{y:1245,font:'Instrument Serif',size:310,it:1,ls:.3});show(A4.el,5.88);
tl.fromTo(A4.chars,{opacity:0,y:40},{opacity:1,y:0,duration:.9,ease:'power3.out',stagger:.06,immediateRender:false},5.88);
tl.fromTo(A4.el,{letterSpacing:'.3em'},{letterSpacing:'.02em',duration:1.0,ease:'expo.out',immediateRender:false},5.88);blurT(A4.el,5.88,30,0,.8,'x');
tl.to(A4.el,{letterSpacing:'.09em',duration:1.9,ease:'sine.inOut'},6.9);
camTo(2.0,5.8,{rotationY:-6,rotationX:-2,scale:1.06});
[A1,A2,A3,A4].forEach((L,i)=>out(L.el,7.72+i*.04,{y:-520,dur:.42,blur:46}));
camTo(7.72,.45,{rotationX:-16,y:-90},'power2.in');

// B — "Hungry for that flesh of mine"
tl.set(cam,{rotationX:16,y:110,rotationY:0,rotationZ:0},8.17);
camTo(8.17,.8,{rotationX:0,y:0,rotationZ:-5,scale:1.02},'expo.out');
camTo(8.97,5.0,{rotationZ:-1.5,scale:1.09});
const B1=line('Hungry',{y:850,font:'Syne',size:170,w:800,ls:-.03,css:`text-shadow:${ext('#6b4a58',12)}`});
inRise(B1.chars,B1.el,8.14,{st:.045,sy:1.9,dur:1.0});
