<style>

#lights{pointer-events:none}

.tile{background:#24162a;border-radius:6px}
.reflect{-webkit-mask-image:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.9) 100%)}

.sc{opacity:0}
#bgTent{background:radial-gradient(70% 30% at 50% 36%,rgba(12,5,12,.62) 0%,rgba(12,5,12,.3) 70%,transparent 100%),radial-gradient(120% 70% at 50% 0%,transparent 0%,rgba(10,4,10,.55) 55%,rgba(8,3,8,.92) 100%),repeating-conic-gradient(from -90deg at 50% -18%,#5a0c24 0deg 6deg,#b9a68c 6deg 12deg)}
#bgSwirl{background:radial-gradient(circle at 50% 45%,rgba(12,6,12,.72) 0%,rgba(10,4,10,.82) 50%,rgba(6,2,6,.96) 100%),repeating-conic-gradient(from 0deg at 50% 50%,#4a0a1d 0deg 10deg,#7a5560 10deg 20deg);transform-origin:50% 50%}

.bd{position:absolute}
.velvet{top:0}
.bdStage{background:radial-gradient(60% 40% at 50% 70%,rgba(255,194,75,.12),transparent 70%),radial-gradient(100% 70% at 50% 40%,#2d1a33 0%,#170c1a 60%,#08040a 100%)}
.bdTent{overflow:hidden;background:#0a0408}.bdTent .spin{position:absolute;inset:-20%;background:radial-gradient(70% 30% at 50% 40%,rgba(12,5,12,.6) 0%,rgba(12,5,12,.3) 70%,transparent 100%),radial-gradient(120% 70% at 50% 0%,transparent 0%,rgba(10,4,10,.55) 55%,rgba(8,3,8,.92) 100%),repeating-conic-gradient(from -90deg at 50% -10%,#5a0c24 0deg 6deg,#b9a68c 6deg 12deg)}

.bdMarq::before,.bdMarq::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,206,110,.6) 0 9px,rgba(255,180,60,.16) 14px,transparent 20px) 0 0/120px 120px}
.bdMarq::after{background-position:60px 60px}.bdMarq[data-c='0']::after{opacity:.25}.bdMarq[data-c='1']::before{opacity:.25}
.bdNeon{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 3px,transparent 3px 9px),radial-gradient(55% 35% at 50% 48%,#7a0f2a 0%,#2a0712 55%,#0a0306 100%)}
.bdArena{background:radial-gradient(70% 45% at 50% 35%,#2a1a2e 0%,#120a12 70%,#070407 100%)}
.ringFloor{position:absolute;left:-560px;top:1320px;width:2200px;height:1500px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#c79a62 0%,#8a6337 45%,#3d2a17 70%,transparent 72%),repeating-conic-gradient(#8e1a39 0deg 8deg,#efe3cf 8deg 16deg);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 70%,transparent 71%)}
.dim{position:absolute;inset:0;background:#000;z-index:2}
.bdClean{background:radial-gradient(90% 60% at 50% 45%,#16101a 0%,#08060a 100%)}
.bdTrail{background:radial-gradient(80% 60% at 30% 60%,#251632 0%,#0c0710 70%)}
.bdMirror{background:#0d0810}
#grain{mix-blend-mode:overlay;opacity:.34;pointer-events:none}
#vign{pointer-events:none;background:radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(5,2,8,.5) 100%)}
#flash{pointer-events:none;opacity:0;background:radial-gradient(60% 40% at 50% 46%,#fff,rgba(255,240,210,.55) 45%,rgba(255,255,255,0) 80%)}

#wm{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:'Clash Display';font-weight:500;font-size:30px;letter-spacing:.16em;color:var(--paper);mix-blend-mode:difference;opacity:.5;pointer-events:none}
</style>

<body>
<div id="stage">
  <div id="bgA" class="full"><div class="blob" id="blobA" style="width:900px;height:900px;left:-300px;top:200px;background:#5a1a3e"></div><div class="blob" id="blobB" style="width:800px;height:800px;left:520px;top:1100px;background:#3a2a6a"></div></div>
  
  
  
  <div id="world"><div id="shake"><div id="cam"></div></div></div>
  <canvas id="stageFx" class="full" width="1080" height="1920"></canvas>
  <div id="flash" class="full"></div>
  <div id="grain" class="full"></div>
  <div id="vign" class="full"></div>
  <div id="fade" class="full"></div>
  <div id="wm">@moura’slyrics</div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<audio id="aud" src="assets/chorus.mp3" preload="auto"></audio>
<script src="assets/gsap.min.js"></script>
<script>
(async()=>{
/* ===== CONFIG — Circus (bye × Circus slowed). video time = song time ===== */
const DUR=70.2, BEAT=0.6037, PH=0;
const CREAM='#F4E9D8', AMBER='#FFC24B', PLUM='#1A0F1F', WHITE='#FFFFFF', BLACK='#0B0B0B', GREEN='#14934B';
const CL='Clash Display', PC='Panchang', GB='Gambetta', RO='Rampart One', NB='Nabla';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cam=$('#cam'),shake=$('#shake'),fx=$('#fx');
const params=new URLSearchParams(location.search),CLEAN=params.has('clean');
function fit(){const k=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(${(innerWidth-1080*k)/2}px,${(innerHeight-1920*k)/2}px) scale(${k})`}
fit();addEventListener('resize',fit);
await Promise.all([`500 40px '${CL}'`,`600 40px '${CL}'`,`700 40px '${CL}'`,`800 40px '${PC}'`,`italic 500 40px '${GB}'`,`italic 600 40px '${GB}'`,`40px '${RO}'`,`40px '${NB}'`].map(f=>document.fonts.load(f)));
await document.fonts.ready;

function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

/* ===== timeline + helpers ===== */
const tl=gsap.timeline({paused:true});
let fid=0;
function blurFilter(){const id='mb'+(fid++);const f=document.createElementNS('http://www.w3.org/2000/svg','filter');
 f.setAttribute('id',id);f.setAttribute('x','-80%');f.setAttribute('y','-80%');f.setAttribute('width','260%');f.setAttribute('height','260%');
 const b=document.createElementNS('http://www.w3.org/2000/svg','feGaussianBlur');b.setAttribute('stdDeviation','0 0');f.appendChild(b);fx.appendChild(f);return{id,b}}
function blurT(el,at,from,to,dur,axis='y',ease='power3.out'){const {id,b}=blurFilter();const o={v:from};
 tl.fromTo(o,{v:from},{v:to,duration:dur,ease,immediateRender:false,onUpdate(){const v=o.v;
  if(v<.2){el.style.filter='none';return}
  b.setAttribute('stdDeviation',axis==='y'?`${(v*.07).toFixed(2)} ${v.toFixed(2)}`:axis==='x'?`${v.toFixed(2)} ${(v*.07).toFixed(2)}`:`${(v*.6).toFixed(2)} ${(v*.6).toFixed(2)}`);
  el.style.filter=`url(#${id})`;}},at)}
function ext(col,n=12,dx=.7,dy=1,soft='rgba(0,0,0,.3)'){let a=[];for(let i=1;i<=n;i++)a.push(`${(i*dx).toFixed(1)}px ${(i*dy).toFixed(1)}px 0 ${col}`);a.push(`${n*dx+6}px ${n*dy+14}px 24px ${soft}`);return a.join(',')}
const LINES=[];
function line(txt,o){const el=document.createElement('div');el.className='ln';
 el.style.cssText=`left:${o.x??540}px;top:${o.y}px;font-family:'${o.font}';font-size:${o.size}px;font-weight:${o.w??500};font-style:${o.it?'italic':'normal'};letter-spacing:${o.ls??0}em;color:${o.color??CREAM};${o.css??''}`;
 const words=[],chars=[];const ws=txt.split(' ');ws.forEach((w,i)=>{const wd=document.createElement('span');wd.className='wd';if(i<ws.length-1)wd.style.marginRight='.26em';
  [...w].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch;wd.appendChild(s);chars.push(s)});el.appendChild(wd);words.push(wd)});
 o.parent.appendChild(el);gsap.set(el,{xPercent:-50,yPercent:-50,z:o.z??0});
 const L={el,words,chars,wc:words.map(w=>[...w.children]),t0:1e9,t1:1e9,amp:o.breathe??4};LINES.push(L);return L}
const live=(L,t)=>{L.t0=Math.min(L.t0,t)};
const show=(el,at)=>tl.set(el,{opacity:1},at);
const impulses=[];const kick=(t,a)=>impulses.push([t,a]);
const FPS=30, RES=1080/1080;
/* --- entry vocabulary: long, layered, from depth; never a dry cut --- */
function inAssemble(L,u,at,{dur=1.15,st=.04,z=-900,ry=-70}={}){show(L.el,at);live(L,at+dur);
 tl.fromTo(u,{opacity:0,z,rotationY:ry,transformOrigin:'50% 50%'},{opacity:1,z:0,rotationY:0,duration:dur,ease:'expo.out',stagger:st,immediateRender:false},at);blurT(L.el,at,16,0,dur*.7,'xy','power2.out')}
function inRoll(L,u,at,{dur=1.0,st=.035}={}){show(L.el,at);live(L,at+dur);
 tl.fromTo(u,{opacity:0,rotationX:95,y:40,transformOrigin:'50% 100% -40px'},{opacity:1,rotationX:0,y:0,duration:dur,ease:'back.out(1.3)',stagger:st,immediateRender:false},at);blurT(L.el,at,18,0,dur*.6,'y')}
function inSwing(L,u,at,{dur=1.1,st=.07}={}){show(L.el,at);live(L,at+dur);
 tl.fromTo(u,{opacity:0,rotationY:105,x:-30,transformOrigin:'0% 50%'},{opacity:1,rotationY:0,x:0,duration:dur,ease:'expo.out',stagger:st,immediateRender:false},at);blurT(L.el,at,20,0,dur*.6,'x')}
function inWave(L,u,at,{dur=1.25,st=.035}={}){show(L.el,at);live(L,at+dur);
 tl.fromTo(u,{opacity:0,yPercent:90,skewY:12,scaleY:1.4,transformOrigin:'50% 100%'},{opacity:1,yPercent:0,skewY:0,scaleY:1,duration:dur,ease:'elastic.out(1,.55)',stagger:st,immediateRender:false},at);blurT(L.el,at,22,0,dur*.4,'y')}
function inFly(L,at,{dur=.9}={}){show(L.el,at);live(L,at+dur);
 tl.fromTo(L.el,{z:1100,opacity:0},{z:0,opacity:1,duration:dur,ease:'expo.out',immediateRender:false},at);blurT(L.el,at,24,0,dur*.6,'xy','power2.out')}
/* exit: letters drift toward the lens and dissolve (the camera carries the rest) */
function outPass(L,at,{dur=.55}={}){L.t1=Math.min(L.t1,at);tl.to(L.chars,{z:380,opacity:0,duration:dur,ease:'power2.in',stagger:.012},at)}
function svgEl(parent,z=0){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',1080);s.setAttribute('height',1920);s.style.cssText='position:absolute;left:0;top:0;overflow:visible';parent.appendChild(s);gsap.set(s,{z});return s}

/* ===== 3D camera through a world of scene groups ===== */
const SC=[ // start, x, y, z, ry(group), shot: [ry0,ry1,rx0,rx1,d0,d1,rz0,rz1]
 [0,    0,   0,     0,   0,[ 6,-4, 6, 2,  0,160,0,0]],
 [4.85, 950,-260, -2600,-26,[-16,10,0,0, 40,180,0,0]],
 [9.6, -760, 220, -5200, 22,[ 10,-6,4,0,  0,140,0,0]],
 [14.4, 640,-160, -7800,-18,[-6, 6, 12,3, 60,200,0,-2]],
 [18.65,  0,   0,-10400,  0,[0,0,0,0,0,0,0,0]],
 [28.05,-900, 260,-13000, 30,[-14,8,6,0,  0,160,0,0]],
 [30.9,  740,-220,-15600,-24,[ 10,-8,0,-4, 80,220,3,-1]],
 [35.15,   0,   0,-18200,  0,[ 0, 6,0,0,  0,120,0,0]],
 [40.6, -620, 300,-20800, 18,[-8, 8,-8,2, 0,180,0,0]],
 [45.6,    0,-100,-23400,  0,[0,0,0,0,  0,140,0,0]],
 [49.4,  820,   0,-26000,-20,[ 12,-6,10,0, 0,160,0,0]],
 [54.1, -820, 200,-28600, 26,[-12,8,0,0, 40,200,3,-1]],
 [58.85, 520,-250,-31200,-16,[ 8,-8,0,0,  0,160,0,0]],
 [63.55,   0,   0,-33800,  0,[ 0, 0,10,0, 0,220,0,0]]];
const G=SC.map(([t,x,y,z,ry])=>{const g=document.createElement('div');g.className='grp';cam.appendChild(g);g.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg)`;return g});
const C={x:540,y:960,z:0,rx:0,ry:0,rz:0,d:0};
SC.forEach(([t,x,y,z,ry,sh0],k)=>{const sh=[sh0[0]*.5,sh0[1]*.5,sh0[2]*.6,sh0[3]*.6,sh0[4]*.6,Math.min(sh0[5],130),sh0[6],sh0[7]];const next=SC[k+1]?.[0]??DUR;const look={x:540+x,y:960+y,z,ry:-ry+sh[0],rx:sh[2],d:sh[4],rz:sh[6]};
 if(k===0){Object.assign(C,look);C.d=-260;tl.to(C,{d:sh[4],duration:2.2,ease:'power2.out'},0)}
 else if(k===5)tl.to(C,{...look,duration:.7,ease:'power3.inOut'},t);else tl.to(C,{...look,duration:k===4?.55:.85,ease:'power3.inOut'},t-.6);
 const hs=k===5?t+.7:t+.25,he=next-.6;if(he>hs&&k!==4)tl.to(C,{ry:-ry+sh[1],rx:sh[3],d:sh[5],rz:sh[7],duration:he-hs,ease:'sine.inOut'},hs)});
function applyCam(){cam.style.transform=`translateZ(${C.d.toFixed(2)}px) rotateX(${C.rx.toFixed(3)}deg) rotateY(${C.ry.toFixed(3)}deg) rotateZ(${C.rz.toFixed(3)}deg) translate3d(${(540-C.x).toFixed(2)}px,${(960-C.y).toFixed(2)}px,${(-C.z).toFixed(2)}px)`}
function dof(t){const coll=t>=18.66&&t<28.05;SC.forEach(([t0,x,y,z],k)=>{const g=G[k];if(coll&&k!==4){g.style.display='none';return}const rel=z-C.z+C.d;const a=Math.abs(rel);
 let op=rel>0?clamp(1-(rel-450)/650):clamp(1-(a-2000)/900);const bl=clamp((a-260)/170,0,9);
 if(op<=0.05){g.style.display='none';return}g.style.display='block';g.style.opacity=op.toFixed(3);g.style.filter=bl>.3?`blur(${bl.toFixed(2)}px)`:'none'})}

/* ===== scenery lives IN the 3D world: planes at real depth behind each scene (parallax + perspective with the camera) ===== */
function plane(k,{z=-1600,m,cls='',tag='div',y=0}={}){const g=G[k];m=m??((1500-z)/1500*1.45);const d=document.createElement(tag);d.className='bd '+cls;
 const W=1080*m,H=1920*m;d.style.cssText=`position:absolute;left:${540-W/2}px;top:${960-H/2+y}px;width:${W}px;height:${H}px`;if(tag==='canvas'){d.width=1080;d.height=1920}
 g.insertBefore(d,g.firstChild);gsap.set(d,{z});return d}
function curtainAt(k,{z=-700,m}={}){const g=G[k];m=m??((1500-z)/1500*1.35);const W=1080*m,H=1920*m;const w=document.createElement('div');
 w.style.cssText=`position:absolute;left:${540-W/2}px;top:${960-H/2}px;width:${W}px;height:${H}px;transform-style:preserve-3d`;
 const L=document.createElement('div'),R=document.createElement('div'),V=document.createElement('div');
 [L,R].forEach((c,i)=>{c.className='velvet';c.style.cssText+=`left:${i?W/2-10:-10}px;top:0;width:${W/2+20}px;height:${H}px`;w.appendChild(c);gsap.set(c,{transformOrigin:i?'100% 50%':'0% 50%'})});
 V.className='valance';V.style.cssText+=`left:-40px;top:0;width:${W+80}px;height:${330*m}px`;w.appendChild(V);g.insertBefore(w,g.firstChild);gsap.set(w,{z});return{L,R,V}}
const CONES=[];
/* volumetric spotlight baked ONCE into an image (same layered beams + radial zoom blur + falloff), so frames don't re-blur it */
const CONE_IMG={};
